openapi: 3.1.0
info:
  title: OweNone API
  version: 1.0.0
  description: Ledger and cross-group settlement API. Money values are integer minor units.
servers:
  - url: http://localhost:8080
paths:
  /health/live:
    get:
      security: []
      responses:
        "200": { description: Process is running }
  /health/ready:
    get:
      security: []
      responses:
        "200": { description: API and database are ready }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/dashboard:
    get:
      summary: Return the current ledger projection and optimal settlement plan
      responses:
        "200":
          description: Dashboard projection
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Dashboard" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/activity:
    get:
      summary: Return a paginated list of all activity for the signed-in user
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Maximum items to return. Default 50, maximum 200. Values above 200 are clamped to 200. Non-integer values are rejected with 400.
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          description: Zero-based index of the first item to return. Default 0. Non-integer values are rejected with 400.
          schema: { type: integer, default: 0, minimum: 0 }
        - name: kind
          in: query
          description: Filter by activity kind. Omit or leave empty to return all activities. Any value other than "expense" or "settlement" is rejected with 400.
          schema: { type: string, enum: [expense, settlement] }
        - name: groupId
          in: query
          description: Filter to a specific group by UUID. Omit or leave empty to return activities across all groups. A malformed (non-UUID) value is rejected with 400. A valid UUID for a group the user does not belong to returns an empty list.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Paginated activity feed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ActivityFeed" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/signup:
    post:
      security: []
      summary: Create a new user account and return a session token. The new account's preferred currency defaults to USD.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, displayName, password]
              properties:
                email: { type: string, format: email }
                displayName: { type: string }
                password: { type: string }
              additionalProperties: false
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AuthTokenData" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      security: []
      summary: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
              additionalProperties: false
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AuthTokenData" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      summary: Invalidate the current session
      responses:
        "200":
          description: Session invalidated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      loggedOut: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/session:
    get:
      summary: Return the current session user
      responses:
        "200":
          description: Active session
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AuthSessionData" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/groups:
    post:
      summary: Create a group from existing friends
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                icon: { type: string }
                memberIds:
                  type: array
                  items: { type: string, format: uuid }
              additionalProperties: false
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/groups/update:
    post:
      summary: Update a group's name, icon, and member list (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupId, name, icon, memberIds]
              properties:
                groupId: { type: string, format: uuid }
                name: { type: string, minLength: 1, maxLength: 100 }
                icon: { type: string, minLength: 1, maxLength: 16 }
                memberIds:
                  type: array
                  items: { type: string, format: uuid }
                  description: Complete desired member list excluding the owner
              additionalProperties: false
      responses:
        "200":
          description: Group updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [group]
                    properties:
                      group: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/groups/delete:
    post:
      summary: Delete an empty group (owner only; refused if any expenses or payments exist)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupId]
              properties:
                groupId: { type: string, format: uuid }
              additionalProperties: false
      responses:
        "200":
          description: Group deleted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [deleted]
                    properties:
                      deleted: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/friends:
    post:
      summary: Connect to an existing user by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
              additionalProperties: false
      responses:
        "201": { description: Friend connected }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/friends/remove:
    post:
      summary: Remove a friend by email (blocked if there is an outstanding balance)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
              additionalProperties: false
      responses:
        "200":
          description: Friend removed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [removed, user]
                    properties:
                      removed: { type: boolean }
                      user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/expenses:
    post:
      summary: Add an expense and its complete split allocation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateExpense" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/settlements:
    post:
      summary: Record a completed payment
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toUserId, amountMinor, currency]
              properties:
                groupId: { type: [string, "null"], format: uuid }
                toUserId: { type: string, format: uuid }
                amountMinor: { type: integer, minimum: 1 }
                currency: { type: string, pattern: "^USD$", description: "Only USD is supported." }
                paymentMethod:
                  type: string
                  enum: ["", "venmo", "paypal", "cashApp", "zelle", "other"]
                  description: Payment app used when the payer confirmed after opening that app. Empty means unspecified.
              additionalProperties: false
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/reminders:
    post:
      summary: Record a reminder to a connected user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipientId]
              properties:
                recipientId: { type: string, format: uuid }
                message: { type: string, maxLength: 500 }
              additionalProperties: false
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/profile:
    post:
      summary: Update the signed-in user's display name and email. Preferred currency is fixed to USD.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, email]
              properties:
                displayName: { type: string, minLength: 1, maxLength: 100 }
                email: { type: string, format: email, maxLength: 320 }
                preferredCurrency:
                  type: string
                  pattern: "^USD$"
                  description: Only USD is supported. Omit or send empty string to keep the existing currency.
                paymentApps:
                  type: object
                  description: Linked payment-app handles. Omit to leave existing links unchanged; send empty strings to clear.
                  additionalProperties: false
                  properties:
                    venmo: { type: string, maxLength: 64 }
                    paypal: { type: string, maxLength: 64 }
                    cashApp: { type: string, maxLength: 64 }
                    zelle: { type: string, maxLength: 128 }
              additionalProperties: false
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [user]
                    properties:
                      user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/profile/password:
    post:
      summary: Change the signed-in user's password and revoke all other sessions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8, maxLength: 128 }
              additionalProperties: false
      responses:
        "200":
          description: Password changed; every session except the caller's is revoked
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      updated: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token obtained from /api/v1/auth/signup or /api/v1/auth/login. The Next.js server forwards it automatically via the owenone_session httpOnly cookie.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
  responses:
    Created:
      description: Resource created
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  id: { type: string, format: uuid }
    Error:
      description: Request failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Money:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor: { type: integer }
        currency: { type: string, pattern: "^USD$", description: "Only USD is supported." }
    User:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        preferredCurrency:
          type: string
          pattern: "^USD$"
          description: "Only USD is supported. New accounts default to USD."
        paymentApps:
          type: object
          additionalProperties: false
          properties:
            venmo: { type: string }
            paypal: { type: string }
            cashApp: { type: string }
            zelle: { type: string }
    GroupBalance:
      type: object
      required: [id, name, icon, members, balance, isOwner]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        icon: { type: string }
        members:
          type: array
          items: { $ref: "#/components/schemas/User" }
        balance: { $ref: "#/components/schemas/Money" }
        isOwner: { type: boolean }
    Group:
      type: object
      required: [id, name, icon, members]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        icon: { type: string }
        members:
          type: array
          items: { $ref: "#/components/schemas/User" }
    FriendBalance:
      type: object
      required: [user, groupNames, balance, isFriend]
      properties:
        user: { $ref: "#/components/schemas/User" }
        groupNames:
          type: array
          items: { type: string }
        balance: { $ref: "#/components/schemas/Money" }
        isFriend: { type: boolean }
    Dashboard:
      type: object
      required: [user, generatedAt, summary, friends, groups, activity, netPositions, suggestion]
      properties:
        user: { $ref: "#/components/schemas/User" }
        generatedAt: { type: string, format: date-time }
        summary:
          type: object
          properties:
            netBalance: { $ref: "#/components/schemas/Money" }
            youOweTotal: { $ref: "#/components/schemas/Money" }
            youAreOwedTotal: { $ref: "#/components/schemas/Money" }
            activeGroups: { type: integer }
            paymentsSaved: { type: integer }
            nextAction: { type: [object, "null"] }
        friends:
          type: array
          items: { $ref: "#/components/schemas/FriendBalance" }
        groups: { type: array, items: { type: object } }
        activity:
          type: array
          items: { $ref: "#/components/schemas/ActivityItem" }
        netPositions: { type: array, items: { type: object } }
        suggestion: { type: object }
    CreateExpense:
      type: object
      required: [groupId, description, amountMinor, currency, split]
      properties:
        groupId: { type: string, format: uuid }
        description: { type: string, maxLength: 200 }
        category: { type: string, maxLength: 40 }
        amountMinor: { type: integer, minimum: 1 }
        currency: { type: string, pattern: "^USD$", description: "Only USD is supported." }
        paidByUserId: { type: string, format: uuid }
        split:
          type: object
          required: [method]
          properties:
            method: { type: string, enum: [equal, exact] }
            participantIds:
              type: array
              items: { type: string, format: uuid }
            shares:
              type: array
              items:
                type: object
                required: [userId, amountMinor]
                properties:
                  userId: { type: string, format: uuid }
                  amountMinor: { type: integer, minimum: 1 }
          additionalProperties: false
      additionalProperties: false
    AuthTokenData:
      type: object
      required: [token, expiresAt, user]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }
    AuthSessionData:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/User" }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    ActivityItem:
      type: object
      required: [id, kind, description, actor, impact, occurredAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [expense, settlement] }
        description: { type: string }
        category: { type: string }
        groupName: { type: string }
        groupId: { type: string, format: uuid }
        actor: { $ref: "#/components/schemas/User" }
        splitMethod: { type: string }
        peopleCount: { type: integer }
        impact: { $ref: "#/components/schemas/Money" }
        occurredAt: { type: string, format: date-time }
    ActivityFeed:
      type: object
      required: [activity, total, hasMore]
      properties:
        activity:
          type: array
          items: { $ref: "#/components/schemas/ActivityItem" }
        total: { type: integer, description: Total number of activities available before paging }
        hasMore: { type: boolean, description: True when offset+len(activity) < total }
security:
  - bearerAuth: []